<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Agenda de Contatos</h1>
        <div class="form-container">
            <input type="text" id="name" placeholder="Nome" />
            <input type="email" id="email" placeholder="Email" />
            <input type="tel" id="phone" placeholder="Telefone" />
            <button onclick="addContact()">Adicionar</button>
        </div>

        <div class="filter-container">
            <input type="text" id="filter" placeholder="Filtrar contatos" oninput="filterContacts()">
        </div>

        <h3>Total de Contatos: <span id="total-count">0</span></h3>

        <table id="contacts-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Os contatos serão exibidos aqui -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
